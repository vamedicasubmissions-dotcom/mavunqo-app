services:
  - type: web
    name: mavunqo-app
    env: python
    buildCommand: "pip install -r requirements.txt && python -m backend.seed"
    startCommand: "python -m backend.server"
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: MAVUNQO_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "true"
