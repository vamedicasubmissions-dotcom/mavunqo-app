<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal | Mavunqo</title>
  <link rel="stylesheet" href="/frontend/style.css">
  <style>
    .uber-admin-header {
      background-color: var(--black);
      color: #ffffff;
      padding: 2rem 1.5rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .uber-panel {
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .uber-panel-title {
      font-size: 1.3rem;
      font-weight: 850;
      color: var(--black);
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Uber-style Dark Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        MAVUNQO<span class="dot">.</span>
        <span class="brand-pill">Merchant Portal</span>
      </a>

      <div class="nav-actions">
        <a href="/" class="btn btn-outline-white btn-sm">Public Directory</a>
        <button onclick="logout();" class="btn btn-white btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <!-- Top Welcome Banner -->
    <div class="uber-admin-header">
      <div>
        <h1 style="font-size: 2rem; font-weight: 900; letter-spacing: -0.03em;">Merchant Dashboard</h1>
        <p style="color: #aaaaaa; font-size: 1rem; margin-top: 0.25rem;">Manage your storefront, services, and live customer inquiries.</p>
      </div>
      <div>
        <a href="/register" class="btn btn-white btn-sm">+ Add Another Listing</a>
      </div>
    </div>

    <div id="bizContainer">
      <!-- Injected owned business listings -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div><strong>MAVUNQO</strong> &copy; 2026. <span data-i18n="footer_text"></span></div>
    </div>
  </footer>

  <script>
    const token = localStorage.getItem("mavunqo_token");
    if (!token) {
      window.location.href = "/login";
    }

    async function loadDashboard() {
      try {
        const res = await fetch("/api/owner/businesses", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) {
          window.location.href = "/login";
          return;
        }
        const businesses = await res.json();
        renderBusinesses(businesses);
      } catch (err) {
        console.error(err);
      }
    }

    async function renderBusinesses(list) {
      const container = document.getElementById("bizContainer");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <h3>No businesses found for your account</h3>
            <p>Ready to get started? <a href="/register">Submit a new business listing application</a>.</p>
          </div>
        `;
        return;
      }

      for (const b of list) {
        const cntRes = await fetch(`/api/owner/businesses/${b.id}/contacts`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const contacts = await cntRes.json();

        let statusBadge = "";
        if (b.status === "approved") {
          statusBadge = `<span class="uber-badge" style="background: #dcfce7; color: #15803d; font-size: 0.85rem; padding: 0.3rem 0.75rem;">● Live & Verified</span>`;
        } else if (b.status === "pending") {
          statusBadge = `<span class="uber-badge" style="background: #fef3c7; color: #92400e; font-size: 0.85rem; padding: 0.3rem 0.75rem;">○ Pending Review</span>`;
        } else {
          statusBadge = `<span class="uber-badge" style="background: #fee2e2; color: #b91c1c; font-size: 0.85rem; padding: 0.3rem 0.75rem;">✕ Rejected</span>`;
        }

        const panel = document.createElement("div");
        panel.className = "uber-panel";
        panel.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
                <h2 style="font-size: 1.8rem; font-weight: 900; letter-spacing: -0.03em;">${b.trading_name}</h2>
                ${statusBadge}
              </div>
              <p style="color: var(--text-secondary); font-size: 0.95rem;">📍 ${b.location_name} &bull; ${b.category_name} &bull; Storefront URL: <code>/b/${b.slug}</code></p>
            </div>
            <div>
              ${b.status === 'approved' ? `<a href="/b/${b.slug}" target="_blank" class="btn btn-primary btn-sm">View Storefront ↗</a>` : ''}
            </div>
          </div>

          <!-- Edit Profile Form -->
          <div class="uber-panel-title">
            <span>Storefront Settings</span>
          </div>
          <form onsubmit="event.preventDefault(); saveProfile('${b.id}', this);">
            <div class="form-row">
              <div>
                <label>Trading Name</label>
                <input type="text" name="trading_name" class="input-field" value="${b.trading_name || ''}">
              </div>
              <div>
                <label>WhatsApp Number</label>
                <input type="text" name="whatsapp" class="input-field" value="${b.whatsapp || ''}">
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>Phone Number</label>
                <input type="text" name="phone" class="input-field" value="${b.phone || ''}">
              </div>
              <div>
                <label>Physical Address</label>
                <input type="text" name="address" class="input-field" value="${b.address || ''}">
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>External Website Link (Optional)</label>
                <input type="url" name="website_url" class="input-field" value="${b.website_url || ''}" placeholder="https://...">
              </div>
              <div>
                <label>Legal Business Name (Protected)</label>
                <input type="text" name="legal_name" class="input-field" value="${b.legal_name || ''}">
              </div>
            </div>

            <div style="margin-bottom: 1.25rem;">
              <label>Description (English)</label>
              <textarea name="description_en" class="input-field" style="height: 70px;">${b.description_en || ''}</textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <label>Description (Spanish)</label>
              <textarea name="description_es" class="input-field" style="height: 70px;">${b.description_es || ''}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>

          <!-- Direct Inquiries Feed -->
          <div style="margin-top: 3rem;">
            <div class="uber-panel-title">
              <span>Customer Inquiries (${contacts.length})</span>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Customer Name</th>
                    <th>Contact Info</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody>
                  ${contacts.length === 0 ? `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">No messages received yet.</td></tr>` : 
                    contacts.map(c => `
                      <tr>
                        <td style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap;">${c.created_at}</td>
                        <td><strong>${c.sender_name}</strong></td>
                        <td><a href="tel:${c.sender_contact}">${c.sender_contact}</a></td>
                        <td>${c.message}</td>
                      </tr>
                    `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.appendChild(panel);
      }
    }

    async function saveProfile(bizId, formEl) {
      const formData = new FormData(formEl);
      const payload = {};
      formData.forEach((val, key) => {
        payload[key] = val;
      });

      try {
        const res = await fetch(`/api/owner/businesses/${bizId}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          let msg = "Storefront updated successfully!";
          if (data.pending_approval && data.pending_approval.length > 0) {
            msg += `\nSensitive fields (${data.pending_approval.join(", ")}) were submitted for admin review.`;
          }
          alert(msg);
          loadDashboard();
        } else {
          alert("Error updating profile: " + data.error);
        }
      } catch (err) {
        alert("Network error.");
      }
    }

    function logout() {
      localStorage.removeItem("mavunqo_token");
      localStorage.removeItem("mavunqo_user");
      window.location.href = "/login";
    }

    document.addEventListener("DOMContentLoaded", loadDashboard);
  </script>
</body>
</html>
