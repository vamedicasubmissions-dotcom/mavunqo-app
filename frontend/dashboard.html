<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchant Portal | Mavunqo</title>
  <link rel="stylesheet" href="/frontend/style.css">
  <style>
    .uber-admin-header {
      background-color: var(--black);
      color: #ffffff;
      padding: 2rem 1.5rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .uber-panel {
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .uber-panel-title {
      font-size: 1.3rem;
      font-weight: 850;
      color: var(--black);
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .catalog-item-card {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .catalog-thumb {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      object-fit: cover;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    .item-info {
      flex: 1;
    }
    .item-price-tag {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F5132;
    }
  </style>
</head>
<body>

  <!-- Uber-style Dark Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        MAVUNQO<span class="dot">.</span>
        <span class="brand-pill">Merchant Portal</span>
      </a>

      <div class="nav-actions">
        <a href="/merchant/ops" class="btn btn-outline-white btn-sm">Live Order Board</a>
        <a href="/" class="btn btn-outline-white btn-sm">Public Directory</a>
        <button onclick="logout();" class="btn btn-white btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem;">
    <!-- Top Welcome Banner -->
    <div class="uber-admin-header">
      <div>
        <h1 style="font-size: 2rem; font-weight: 900; letter-spacing: -0.03em;">Merchant Dashboard</h1>
        <p style="color: #aaaaaa; font-size: 1rem; margin-top: 0.25rem;">Manage your storefront, product pricing, photos, and live customer inquiries.</p>
      </div>
      <div>
        <a href="/register" class="btn btn-white btn-sm">+ Add Another Listing</a>
      </div>
    </div>

    <div id="bizContainer">
      <!-- Injected owned business listings -->
    </div>
  </main>

  <!-- Modal: Add / Edit Product with Price & Photo -->
  <div id="productModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: #FFF; border-radius: 12px; max-width: 500px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <h3 style="margin-top: 0; font-size: 1.25rem; font-weight: 800;" id="modalProductTitle">Add Item to Catalog</h3>
      
      <form id="productForm" onsubmit="event.preventDefault(); submitProductForm();">
        <input type="hidden" id="itemBizId">
        <input type="hidden" id="itemId">

        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px;">Item / Product Name *</label>
          <input type="text" id="itemNameEn" required class="input-field" placeholder="e.g. Caribbean White Linen Shirt">
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px;">Selling Price (RD$) *</label>
          <input type="number" id="itemPrice" step="0.01" min="1" required class="input-field" placeholder="1850.00">
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px;">Product Photo (Upload or Link) *</label>
          <div style="display: flex; gap: 8px; margin-bottom: 6px;">
            <input type="file" id="itemPhotoFile" accept="image/*" style="display: none;" onchange="handleProductPhotoUpload(this);">
            <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('itemPhotoFile').click();">📁 Upload Photo from Device</button>
            <span id="uploadStatusText" style="font-size: 0.8rem; color: #16a34a; align-self: center;"></span>
          </div>
          <input type="url" id="itemPhotoUrl" class="input-field" placeholder="https://... or uploaded image path">
          <small style="color: #64748B; font-size: 0.75rem;">Upload photo directly from phone/laptop or paste any direct image URL</small>
          <div id="productPhotoPreviewContainer" style="margin-top: 6px; display: none;">
            <img id="productPhotoPreview" src="" style="width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1;">
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label style="font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 4px;">Description</label>
          <textarea id="itemDescEn" class="input-field" style="height: 60px;" placeholder="100% natural breathable linen fabric, perfect for beachwear."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn btn-outline" onclick="closeProductModal();">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSaveProduct">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-container">
      <div><strong>MAVUNQO</strong> &copy; 2026. <span data-i18n="footer_text"></span></div>
    </div>
  </footer>

  <script>
    const token = localStorage.getItem("mavunqo_token");
    if (!token) {
      window.location.href = "/login";
    }

    let activeBusinessId = null;

    async function loadDashboard() {
      try {
        const res = await fetch("/api/owner/businesses", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) {
          window.location.href = "/login";
          return;
        }
        const businesses = await res.json();
        renderBusinesses(businesses);
      } catch (err) {
        console.error(err);
      }
    }

    async function renderBusinesses(list) {
      const container = document.getElementById("bizContainer");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `
          <div class="state-box">
            <h3>No businesses found for your account</h3>
            <p>Ready to get started? <a href="/register">Submit a new business listing application</a>.</p>
          </div>
        `;
        return;
      }

      for (const b of list) {
        activeBusinessId = b.id;
        const [cntRes, catRes] = await Promise.all([
          fetch(`/api/owner/businesses/${b.id}/contacts`, { headers: { "Authorization": `Bearer ${token}` } }),
          fetch(`/api/owner/businesses/${b.id}/catalog`, { headers: { "Authorization": `Bearer ${token}` } })
        ]);

        const contacts = await cntRes.json();
        const catalog = await catRes.json();

        let statusBadge = "";
        if (b.status === "approved") {
          statusBadge = `<span class="uber-badge" style="background: #dcfce7; color: #15803d; font-size: 0.85rem; padding: 0.3rem 0.75rem;">● Live & Verified</span>`;
        } else if (b.status === "pending") {
          statusBadge = `<span class="uber-badge" style="background: #fef3c7; color: #92400e; font-size: 0.85rem; padding: 0.3rem 0.75rem;">○ Pending Review</span>`;
        } else {
          statusBadge = `<span class="uber-badge" style="background: #fee2e2; color: #b91c1c; font-size: 0.85rem; padding: 0.3rem 0.75rem;">✕ Rejected</span>`;
        }

        const panel = document.createElement("div");
        panel.className = "uber-panel";
        panel.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
                <h2 style="font-size: 1.8rem; font-weight: 900; letter-spacing: -0.03em;">${b.trading_name}</h2>
                ${statusBadge}
              </div>
              <p style="color: var(--text-secondary); font-size: 0.95rem;">📍 ${b.location_name} &bull; ${b.category_name} &bull; Storefront: <code>/b/${b.slug}</code></p>
            </div>
            <div style="display: flex; gap: 8px;">
              ${b.status === 'approved' ? `<a href="/b/${b.slug}" target="_blank" class="btn btn-outline btn-sm">View Storefront ↗</a>` : ''}
              <button onclick="openAddProductModal('${b.id}');" class="btn btn-primary btn-sm">+ Add Item / Photo</button>
            </div>
          </div>

          <!-- Product Catalog Section (Price and Photos) -->
          <div style="margin-bottom: 2.5rem;">
            <div class="uber-panel-title">
              <span>Catalog & Products (${catalog.length || 0})</span>
              <button onclick="openAddProductModal('${b.id}');" class="btn btn-primary btn-sm">+ Add Item / Set Price</button>
            </div>

            <div id="catalogList_${b.id}">
              ${(catalog && catalog.length > 0) ? catalog.map(it => `
                <div class="catalog-item-card">
                  <div style="display: flex; gap: 12px; align-items: center;">
                    ${it.image_url ? `<img src="${it.image_url}" class="catalog-thumb" alt="${it.name_en}">` : `<div class="catalog-thumb">🛍️</div>`}
                    <div class="item-info">
                      <div style="font-weight: 800; font-size: 1.05rem;">${it.name_en}</div>
                      <div style="color: #64748B; font-size: 0.85rem;">${it.description_en || ''}</div>
                      ${it.category_name ? `<span style="font-size: 0.75rem; background: #E2E8F0; padding: 2px 6px; border-radius: 4px;">${it.category_name}</span>` : ''}
                    </div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 16px;">
                    <span class="item-price-tag">RD$ ${parseFloat(it.price).toFixed(2)}</span>
                    <button class="btn btn-outline btn-sm" onclick="editProduct('${b.id}', '${it.id}', '${escape(it.name_en)}', ${it.price}, '${escape(it.image_url || '')}', '${escape(it.description_en || '')}')">Edit Price / Photo</button>
                    <button class="btn btn-outline btn-sm" style="color: #DC2626;" onclick="deleteProduct('${b.id}', '${it.id}')">Delete</button>
                  </div>
                </div>
              `).join("") : `<p style="color: var(--text-muted); font-size: 0.95rem;">No items entered yet. Click '+ Add Item / Set Price' to enter your products, prices, and photos.</p>`}
            </div>
          </div>

          <!-- Storefront Settings Profile -->
          <div class="uber-panel-title">
            <span>Storefront Settings</span>
          </div>
          <form onsubmit="event.preventDefault(); saveProfile('${b.id}', this);">
            <div class="form-row">
              <div>
                <label>Trading Name</label>
                <input type="text" name="trading_name" class="input-field" value="${b.trading_name || ''}">
              </div>
              <div>
                <label>WhatsApp Number</label>
                <input type="text" name="whatsapp" class="input-field" value="${b.whatsapp || ''}">
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>Phone Number</label>
                <input type="text" name="phone" class="input-field" value="${b.phone || ''}">
              </div>
              <div>
                <label>Physical Address</label>
                <input type="text" name="address" class="input-field" value="${b.address || ''}">
              </div>
            </div>

            <div class="form-row">
              <div>
                <label>Cover Photo URL</label>
                <input type="url" name="cover_image_url" class="input-field" value="${b.cover_image_url || ''}" placeholder="https://...">
              </div>
              <div>
                <label>Logo Photo URL</label>
                <input type="url" name="logo_url" class="input-field" value="${b.logo_url || ''}" placeholder="https://...">
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Profile Changes</button>
          </form>

          <!-- Direct Inquiries Feed -->
          <div style="margin-top: 3rem;">
            <div class="uber-panel-title">
              <span>Customer Inquiries (${contacts.length})</span>
            </div>
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Customer Name</th>
                    <th>Contact Info</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody>
                  ${contacts.length === 0 ? `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">No messages received yet.</td></tr>` : 
                    contacts.map(c => `
                      <tr>
                        <td style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap;">${c.created_at}</td>
                        <td><strong>${c.sender_name}</strong></td>
                        <td><a href="tel:${c.sender_contact}">${c.sender_contact}</a></td>
                        <td>${c.message}</td>
                      </tr>
                    `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.appendChild(panel);
      }
    }

    async function handleProductPhotoUpload(inputEl) {
      if (!inputEl.files || inputEl.files.length === 0) return;
      const file = inputEl.files[0];
      const statusText = document.getElementById("uploadStatusText");
      statusText.style.color = "#2563eb";
      statusText.innerText = "Uploading photo...";

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              image: e.target.result,
              filename: file.name
            })
          });
          const data = await res.json();
          if (res.ok && data.url) {
            document.getElementById("itemPhotoUrl").value = data.url;
            statusText.style.color = "#16a34a";
            statusText.innerText = "✓ Uploaded!";
            const prev = document.getElementById("productPhotoPreview");
            prev.src = data.url;
            document.getElementById("productPhotoPreviewContainer").style.display = "block";
          } else {
            statusText.style.color = "#dc2626";
            statusText.innerText = data.error || "Upload failed";
          }
        } catch (err) {
          statusText.style.color = "#dc2626";
          statusText.innerText = "Network error uploading photo";
        }
      };
      reader.readAsDataURL(file);
    }

    function openAddProductModal(bizId) {
      document.getElementById("itemBizId").value = bizId;
      document.getElementById("itemId").value = "";
      document.getElementById("itemNameEn").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemPhotoUrl").value = "";
      document.getElementById("itemDescEn").value = "";
      document.getElementById("uploadStatusText").innerText = "";
      document.getElementById("productPhotoPreviewContainer").style.display = "none";
      document.getElementById("modalProductTitle").innerText = "Add Item to Catalog";
      document.getElementById("productModal").style.display = "flex";
    }

    function editProduct(bizId, itemId, name, price, photoUrl, desc) {
      document.getElementById("itemBizId").value = bizId;
      document.getElementById("itemId").value = itemId;
      document.getElementById("itemNameEn").value = unescape(name);
      document.getElementById("itemPrice").value = price;
      const url = unescape(photoUrl);
      document.getElementById("itemPhotoUrl").value = url;
      document.getElementById("itemDescEn").value = unescape(desc);
      document.getElementById("uploadStatusText").innerText = "";
      if (url) {
        document.getElementById("productPhotoPreview").src = url;
        document.getElementById("productPhotoPreviewContainer").style.display = "block";
      } else {
        document.getElementById("productPhotoPreviewContainer").style.display = "none";
      }
      document.getElementById("modalProductTitle").innerText = "Edit Item, Price & Photo";
      document.getElementById("productModal").style.display = "flex";
    }

    function closeProductModal() {
      document.getElementById("productModal").style.display = "none";
    }

    async function submitProductForm() {
      const bizId = document.getElementById("itemBizId").value;
      const itemId = document.getElementById("itemId").value;
      const payload = {
        name_en: document.getElementById("itemNameEn").value,
        price: parseFloat(document.getElementById("itemPrice").value),
        image_url: document.getElementById("itemPhotoUrl").value,
        description_en: document.getElementById("itemDescEn").value
      };

      const isEdit = Boolean(itemId);
      const url = isEdit ? `/api/owner/businesses/${bizId}/catalog/${itemId}` : `/api/owner/businesses/${bizId}/catalog`;
      const method = isEdit ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method: method,
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          closeProductModal();
          loadDashboard();
        } else {
          const err = await res.json();
          alert(err.error || "Failed to save product.");
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function deleteProduct(bizId, itemId) {
      if (!confirm("Are you sure you want to remove this item from your catalog?")) return;
      try {
        const res = await fetch(`/api/owner/businesses/${bizId}/catalog/${itemId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          loadDashboard();
        } else {
          alert("Error deleting item.");
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function saveProfile(bizId, formEl) {
      const formData = new FormData(formEl);
      const payload = {};
      formData.forEach((val, key) => { payload[key] = val; });

      try {
        const res = await fetch(`/api/owner/businesses/${bizId}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert("Profile and photos updated successfully!");
          loadDashboard();
        } else {
          alert(data.error || "Failed to update profile.");
        }
      } catch (err) {
        console.error(err);
      }
    }

    function logout() {
      localStorage.removeItem("mavunqo_token");
      window.location.href = "/login";
    }

    window.onload = loadDashboard;
  </script>
</body>
</html>
