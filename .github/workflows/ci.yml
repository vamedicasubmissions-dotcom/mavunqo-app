name: MAVUNQO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Backend Test Suite
        run: python -m unittest backend.tests backend.test_http backend.test_phase2_requests backend.test_whatsapp_ordering -v
